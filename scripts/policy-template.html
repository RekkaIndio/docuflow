<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Policy PDF</title>
  <style>
    body { font-family: "Helvetica Neue", Arial, sans-serif; color: #111; padding: 40px; }
    .header { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
    .logo { width: 64px; height: 64px; object-fit: contain; }
    h1 { font-size: 24px; margin: 0; }
    h2, h3 { color: #333; }
    p { line-height: 1.5; }
    .meta { margin-bottom: 18px; }
    .section { margin-top: 18px; }
    ul { margin-left: 20px; }
    pre { white-space: pre-wrap; }
    footer { margin-top: 48px; font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <header class="header">
    <img src="{{logo}}" alt="CG360" class="logo" />
    <div>
      <h1>{{title}}</h1>
      <div class="meta">Version: {{version}} &nbsp; | &nbsp; Effective: {{effectiveDate}} &nbsp; | &nbsp; Review: {{reviewDate}}</div>
    </div>
  </header>
  <div id="content">{{content}}</div>
  <footer>Generated by CG360</footer>
</body>
</html>
