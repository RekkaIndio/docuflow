<html>
  <body style="font-family: Arial, sans-serif; background: #f6f8fa; margin: 0; padding: 0;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background: #f6f8fa; padding: 0; margin: 0;">
      <tr>
        <td align="center">
          <table width="600" cellpadding="0" cellspacing="0" style="background: #fff; margin: 40px 0; border-radius: 12px; box-shadow: 0 2px 8px #0001; overflow: hidden;">
            <tr>
              <td style="background: #0070f3; padding: 28px 0; text-align: center;">
                <img src="https://docuflow.ai/assets/Neurodiversity_Symbol.png" alt="Docuflow Logo" width="60" height="60" style="display: block; margin: 0 auto 8px;" />
                <h1 style="color: #fff; font-size: 2em; margin: 0; letter-spacing: 1px;">Document Uploaded</h1>
              </td>
            </tr>
            <tr>
              <td style="padding: 32px 40px 20px 40px; text-align: left;">
                <h2 style="color: #222; font-size: 1.2em; margin-top: 0;">Hello {{managerName}},</h2>
                <p style="font-size: 1.1em; color: #444; line-height: 1.6;">
                  A new document has been uploaded by <b>{{uploadedBy}}</b>.<br/>
                  <b>Document:</b> {{documentName}}<br/>
                  <b>Uploaded at:</b> {{uploadedAt}}
                </p>
                <p style="font-size: 1.1em; color: #444; line-height: 1.6;">
                  Please review the document in your admin dashboard.
                </p>
                <p style="font-size: 1.1em; color: #444; line-height: 1.6; margin-bottom: 0;">
                  Regards,<br/>
                  <span style="color: #0070f3; font-weight: bold;">Docuflow System</span>
                </p>
              </td>
            </tr>
            <tr>
              <td style="background: #f6f8fa; color: #888; font-size: 0.95em; text-align: center; padding: 14px 0; border-top: 1px solid #eee;">
                &copy; 2025 Docuflow. All rights reserved.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
